<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión — NeumorStudio</title>
<!--
  Autocontenida a propósito: ni un solo fichero externo.

  Antes el fallback offline era la propia portada precacheada. El problema no
  era servir HTML viejo —la navegación es network-first y online siempre llega
  el fresco—, sino que esa copia congelada apuntaba a chunks de Next con hash
  que, meses y veinte despliegues después, ya no existen. Sin red y sin esos
  chunks, la pantalla se quedaba en blanco: justo lo que el service worker
  estaba ahí para evitar.
-->
<style>
  :root { color-scheme: light dark; --bg:#e9edf4; --fg:#161a22; --soft:#4a5264; --acc:#3d5afe }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --fg:#e8ebf3; --soft:#9aa3b5; --acc:#5c77ff }
  }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem;
    background:var(--bg); color:var(--fg); text-align:center;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  h1 { font-size:1.5rem; margin:0 0 .75rem; letter-spacing:-.02em }
  p { color:var(--soft); margin:0 0 1.5rem; max-width:32ch; line-height:1.6 }
  a { color:var(--acc); font-weight:600; text-decoration:none }
</style>
</head>
<body>
  <main>
    <h1>Sin conexión</h1>
    <p>No hemos podido cargar la página. Comprueba tu conexión e inténtalo otra vez.</p>
    <p><a href="/">Reintentar</a> · <a href="mailto:info@neumorstudio.com">info@neumorstudio.com</a></p>
  </main>
</body>
</html>
